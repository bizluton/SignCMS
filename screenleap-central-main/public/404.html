<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SignCMS</title>
  <script>
    // SPA fallback: redirect 404s back to index.html preserving the path.
    // Encodes the path into the query string so the server serves index.html,
    // then the decode script in index.html restores the original URL via history.replaceState.
    (function () {
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host + l.pathname.split('/').slice(0, 1).join('/') +
        '/?/' + l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    })();
  </script>
</head>
<body></body>
</html>
