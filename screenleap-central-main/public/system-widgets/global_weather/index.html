<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1">
<title>Global Weather</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;overflow:hidden;font-family:'Arial',sans-serif}
body{display:flex;align-items:center;justify-content:center}

/* ── Portrait layout ── */
#portrait{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;gap:2%}
#portrait .icon-wrap{display:flex;align-items:center;justify-content:center;width:45vmin;height:45vmin;max-width:45vh;max-height:45vh;flex-shrink:0}
#portrait .icon-wrap img{width:100%;height:100%;object-fit:contain;transition:filter 0.8s ease}
#portrait .meta{display:flex;flex-direction:column;align-items:center;gap:0.3em}
#portrait .location{font-size:clamp(0.7rem,4vmin,1.6rem);opacity:0.7;letter-spacing:0.04em}
#portrait .temperature{font-size:clamp(1.4rem,9vmin,4rem);font-weight:700;letter-spacing:-0.02em;line-height:1}
#portrait .description{font-size:clamp(0.6rem,3.5vmin,1.3rem);opacity:0.85;text-align:center;max-width:90%}
#portrait .pop{font-size:clamp(0.5rem,2.8vmin,1.1rem);opacity:0.6;display:flex;align-items:center;gap:0.3em}
#portrait .extras{font-size:clamp(0.45rem,2.5vmin,0.95rem);opacity:0.6;display:flex;align-items:center;gap:0.8em}

/* ── Landscape layout ── */
#landscape{display:flex;flex-direction:row;align-items:center;justify-content:center;width:100%;height:100%;gap:3%}
#landscape .icon-wrap{display:flex;align-items:center;justify-content:center;width:40vmin;height:40vmin;max-width:40vh;max-height:40vh;flex-shrink:0}
#landscape .icon-wrap img{width:100%;height:100%;object-fit:contain;transition:filter 0.8s ease}
#landscape .meta{display:flex;flex-direction:column;justify-content:center;gap:0.25em}
#landscape .location{font-size:clamp(0.7rem,3.5vmin,1.4rem);opacity:0.7;letter-spacing:0.04em}
#landscape .temperature{font-size:clamp(1.6rem,10vmin,4.5rem);font-weight:700;letter-spacing:-0.02em;line-height:1}
#landscape .description{font-size:clamp(0.6rem,3vmin,1.2rem);opacity:0.85}
#landscape .pop{font-size:clamp(0.5rem,2.5vmin,1rem);opacity:0.6;display:flex;align-items:center;gap:0.3em}
#landscape .extras{font-size:clamp(0.45rem,2.3vmin,0.9rem);opacity:0.6;display:flex;align-items:center;gap:0.8em}
.extras-hum,.extras-aqi{display:inline-flex;align-items:center;gap:0.2em}
.aqi-dot{display:inline-block;width:0.65em;height:0.65em;border-radius:50%;flex-shrink:0;background:#94a3b8}

[hidden]{display:none!important}
</style>
</head>
<body>

<!-- Portrait -->
<div id="portrait" hidden>
  <div class="icon-wrap"><img id="p-icon" src="" alt="天氣圖示"></div>
  <div class="meta">
    <div class="location" id="p-location">―</div>
    <div class="temperature" id="p-temp">―°C</div>
    <div class="description" id="p-desc">載入中…</div>
    <div class="pop">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="1em" height="1em"><path d="M23 12a11.05 11.05 0 0 0-22 0"/><path d="M12 12v6a3 3 0 0 1-6 0"/></svg>
      <span id="p-pop">―%</span>
      <span class="extras-hum"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="0.85em" height="0.85em"><path d="M12 2C8.5 7 4 12 4 15.5a8 8 0 0 0 16 0C20 12 15.5 7 12 2z"/></svg><span id="p-hum">―</span></span>
    </div>
    <div class="extras">
      <span>UV <span id="p-uv">―</span></span>
      <span class="extras-aqi"><span class="aqi-dot" id="p-aqi-dot"></span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="0.9em" height="0.9em"><path d="M4 14h16M4 18h12M7 10h13a3 3 0 0 0 0-6h-.34A5 5 0 1 0 7 10z"/></svg><span id="p-pm25">―</span></span>
    </div>
  </div>
</div>

<!-- Landscape -->
<div id="landscape" hidden>
  <div class="icon-wrap"><img id="l-icon" src="" alt="天氣圖示"></div>
  <div class="meta">
    <div class="location" id="l-location">―</div>
    <div class="temperature" id="l-temp">―°C</div>
    <div class="description" id="l-desc">載入中…</div>
    <div class="pop">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="1em" height="1em"><path d="M23 12a11.05 11.05 0 0 0-22 0"/><path d="M12 12v6a3 3 0 0 1-6 0"/></svg>
      <span id="l-pop">―%</span>
      <span class="extras-hum"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="0.85em" height="0.85em"><path d="M12 2C8.5 7 4 12 4 15.5a8 8 0 0 0 16 0C20 12 15.5 7 12 2z"/></svg><span id="l-hum">―</span></span>
    </div>
    <div class="extras">
      <span>UV <span id="l-uv">―</span></span>
      <span class="extras-aqi"><span class="aqi-dot" id="l-aqi-dot"></span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="0.9em" height="0.9em"><path d="M4 14h16M4 18h12M7 10h13a3 3 0 0 0 0-6h-.34A5 5 0 1 0 7 10z"/></svg><span id="l-pm25">―</span></span>
    </div>
  </div>
</div>

<script>
// ── Read params (SignCMS injects window.__widgetParams, fallback to URL) ──────────────
function getParam(key, def) {
  var p = window.__widgetParams;
  if (p && p[key] !== undefined && p[key] !== null && p[key] !== '') return p[key];
  var items = location.search.substr(1).split('&'), i, tmp;
  for (i = 0; i < items.length; i++) {
    tmp = items[i].split('=');
    if (tmp[0] === key && tmp[1] !== undefined)
      return decodeURIComponent(decodeURIComponent(tmp[1]));
  }
  return def;
}

var city       = getParam('city',       'Tokyo');
var country    = getParam('country',    'JP');
var lat        = getParam('lat',        '');
var lon        = getParam('lon',        '');
var lang       = getParam('lang',       'zh');
var fontColor  = getParam('fontColor',  '#cccccc');
var wallColor  = getParam('wallColor',  '#0f172a');
var layoutMode = getParam('layoutMode', 'auto');

// ── Apply colours ────────────────────────────────────────────────────────────
document.body.style.background = wallColor;
document.body.style.color      = fontColor;

// ── Layout ────────────────────────────────────────────────────────────────────
var isLandscape;
function applyLayout() {
  var forced = layoutMode === 'landscape' ? true
             : layoutMode === 'portrait'  ? false
             : window.innerWidth > window.innerHeight;
  if (forced === isLandscape) return;
  isLandscape = forced;
  document.getElementById('portrait' ).hidden = isLandscape;
  document.getElementById('landscape').hidden = !isLandscape;
}

// ── Weather icon — Meteocons animated SVG (jsDelivr → GitHub CDN) ─────────────
var ICON_BASE = 'https://cdn.jsdelivr.net/gh/basmilius/weather-icons@dev/production/fill/svg/';

function wmoToIcon(wmo, isDay) {
  var n = parseInt(wmo) || 0;
  var d = (isDay === 1 || isDay === '1');
  if (n === 0 || n === 1)           return d ? 'clear-day'                 : 'clear-night';
  if (n === 2)                      return d ? 'partly-cloudy-day'         : 'partly-cloudy-night';
  if (n === 3)                      return 'overcast';
  if (n === 45 || n === 48)         return d ? 'fog-day'                   : 'fog-night';
  if (n >= 51 && n <= 55)           return d ? 'partly-cloudy-day-drizzle' : 'partly-cloudy-night-drizzle';
  if (n === 56 || n === 57)         return 'sleet';
  if (n === 61 || n === 80)         return d ? 'partly-cloudy-day-rain'    : 'partly-cloudy-night-rain';
  if (n === 63 || n === 81)         return 'rain';
  if (n === 65 || n === 82)         return 'overcast-rain';
  if (n === 66 || n === 67)         return 'sleet';
  if (n >= 71 && n <= 77)           return 'snow';
  if (n === 85 || n === 86)         return d ? 'partly-cloudy-day-snow'    : 'partly-cloudy-night-snow';
  if (n >= 95)                      return 'thunderstorms-rain';
  return d ? 'partly-cloudy-day' : 'partly-cloudy-night';
}

function wmoToGlow(wmo, isDay) {
  var n = parseInt(wmo) || 0;
  var d = (isDay === 1 || isDay === '1');
  if (n === 0 || n === 1) return d
    ? 'drop-shadow(0 0 28px rgba(251,191,36,0.9))'
    : 'drop-shadow(0 0 22px rgba(96,165,250,0.75))';
  if (n === 2) return d
    ? 'drop-shadow(0 0 20px rgba(125,211,252,0.75))'
    : 'drop-shadow(0 0 20px rgba(30,64,175,0.65))';
  if (n === 3)                       return 'drop-shadow(0 0 16px rgba(148,163,184,0.65))';
  if (n === 45 || n === 48)          return 'drop-shadow(0 0 16px rgba(203,213,225,0.6))';
  if (n >= 51 && n <= 55)            return 'drop-shadow(0 0 18px rgba(147,197,253,0.75))';
  if (n === 56 || n === 57 || n === 66 || n === 67)
                                     return 'drop-shadow(0 0 18px rgba(186,230,253,0.8))';
  if ((n >= 61 && n <= 65) || (n >= 80 && n <= 82))
                                     return 'drop-shadow(0 0 22px rgba(59,130,246,0.85))';
  if (n >= 71 && n <= 77)            return 'drop-shadow(0 0 20px rgba(186,230,253,0.9))';
  if (n === 85 || n === 86)          return 'drop-shadow(0 0 18px rgba(147,197,253,0.75))';
  if (n >= 95)                       return 'drop-shadow(0 0 28px rgba(99,102,241,0.9))';
  return 'drop-shadow(0 0 14px rgba(148,163,184,0.5))';
}

function updateIcon(wmo, isDay) {
  var src  = ICON_BASE + wmoToIcon(wmo, isDay) + '.svg';
  var glow = wmoToGlow(wmo, isDay);
  ['p','l'].forEach(function(pfx) {
    var img = document.getElementById(pfx + '-icon');
    img.src          = src;
    img.style.filter = glow;
  });
}

// ── AQI dot colour (European AQI scale) ──────────────────────────────────────
function aqiColor(aqi) {
  var n = parseInt(aqi);
  if (isNaN(n) || aqi === '--') return '#94a3b8';
  if (n <= 20)  return '#22c55e';
  if (n <= 40)  return '#84cc16';
  if (n <= 60)  return '#f97316';
  if (n <= 80)  return '#f87171';
  if (n <= 100) return '#dc2626';
  return '#991b1b';
}

// ── UI update ─────────────────────────────────────────────────────────────────
function updateUI(location, temp, desc, pop, uv, aqi, pm25, humidity, wmo, isDay) {
  ['p','l'].forEach(function(pfx) {
    document.getElementById(pfx + '-location').textContent     = location;
    document.getElementById(pfx + '-temp').textContent         = temp + '°C';
    document.getElementById(pfx + '-desc').textContent         = desc;
    document.getElementById(pfx + '-pop').textContent          = pop + '%';
    document.getElementById(pfx + '-uv').textContent           = (uv       && uv       !== '--') ? uv       : '―';
    document.getElementById(pfx + '-hum').textContent          = (humidity && humidity !== '--') ? humidity + '%' : '―';
    document.getElementById(pfx + '-aqi-dot').style.background = aqiColor(aqi);
    document.getElementById(pfx + '-pm25').textContent         = (pm25     && pm25     !== '--') ? pm25 + ' μg/m³' : '―';
  });
  updateIcon(wmo != null ? wmo : '2', isDay != null ? isDay : '1');
}

// ── Fetch via unified weather Edge Function ───────────────────────────────────
var EDGE_URL = 'https://narhbpojjtnalyfiwxue.supabase.co/functions/v1/weather';

function fetchWeather() {
  var url;
  if (lat && lon) {
    url = EDGE_URL + '?lat=' + encodeURIComponent(lat) + '&lon=' + encodeURIComponent(lon)
        + '&lang=' + encodeURIComponent(lang);
  } else {
    url = EDGE_URL + '?city=' + encodeURIComponent(city) + '&country=' + encodeURIComponent(country)
        + '&lang=' + encodeURIComponent(lang);
  }

  fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.error) throw new Error(d.error);
      try {
        localStorage.setItem('gw_cache', JSON.stringify({
          loc: d.location, temp: d.temp, wx: d.wx, pop: d.pop,
          uv: d.uv, aqi: d.aqi, pm25: d.pm25, humidity: d.humidity,
          wmo: d.wmo, is_day: d.is_day, ts: Date.now()
        }));
      } catch(e) {}
      updateUI(d.location, d.temp, d.wx, d.pop, d.uv, d.aqi, d.pm25, d.humidity, d.wmo, d.is_day);
    })
    .catch(function() {
      var cached = null;
      try { cached = JSON.parse(localStorage.getItem('gw_cache') || 'null'); } catch(e) {}
      if (cached)
        updateUI(cached.loc, cached.temp, cached.wx, cached.pop, cached.uv, cached.aqi, cached.pm25, cached.humidity, cached.wmo, cached.is_day);
      else
        updateUI(city, '--', '無法連線', '--', '--', '--', '--', '--', null, null);
    });
}

// ── Hourly refresh ────────────────────────────────────────────────────────────
setInterval(function() {
  var now = new Date();
  if (now.getMinutes() === 0 && now.getSeconds() === 0) fetchWeather();
}, 1000);

// ── Init ──────────────────────────────────────────────────────────────────────
window.addEventListener('load', function() {
  applyLayout();
  fetchWeather();
});
window.addEventListener('resize', applyLayout);
</script>
</body>
</html>
