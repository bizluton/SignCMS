<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;overflow:hidden;font-family:'Arial',sans-serif}
body{display:flex;align-items:center;justify-content:center}

/* ── Portrait layout ── */
#portrait{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;gap:2%}
#portrait .icon-wrap{display:flex;align-items:center;justify-content:center;width:45vmin;height:45vmin;max-width:45vh;max-height:45vh;flex-shrink:0}
#portrait canvas{width:100%!important;height:100%!important}
#portrait .meta{display:flex;flex-direction:column;align-items:center;gap:0.3em}
#portrait .location{font-size:clamp(0.7rem,4vmin,1.6rem);opacity:0.7;letter-spacing:0.04em}
#portrait .temperature{font-size:clamp(1.4rem,9vmin,4rem);font-weight:700;letter-spacing:-0.02em;line-height:1}
#portrait .description{font-size:clamp(0.6rem,3.5vmin,1.3rem);opacity:0.85;text-align:center;max-width:90%}
#portrait .pop{font-size:clamp(0.5rem,2.8vmin,1.1rem);opacity:0.6;display:flex;align-items:center;gap:0.3em}
#portrait .extras{font-size:clamp(0.45rem,2.5vmin,0.95rem);opacity:0.6;display:flex;align-items:center;gap:0.8em}

/* ── Landscape layout ── */
#landscape{display:flex;flex-direction:row;align-items:center;justify-content:center;width:100%;height:100%;gap:3%}
#landscape .icon-wrap{display:flex;align-items:center;justify-content:center;width:40vmin;height:40vmin;max-width:40vh;max-height:40vh;flex-shrink:0}
#landscape canvas{width:100%!important;height:100%!important}
#landscape .meta{display:flex;flex-direction:column;justify-content:center;gap:0.25em}
#landscape .location{font-size:clamp(0.7rem,3.5vmin,1.4rem);opacity:0.7;letter-spacing:0.04em}
#landscape .temperature{font-size:clamp(1.6rem,10vmin,4.5rem);font-weight:700;letter-spacing:-0.02em;line-height:1}
#landscape .description{font-size:clamp(0.6rem,3vmin,1.2rem);opacity:0.85}
#landscape .pop{font-size:clamp(0.5rem,2.5vmin,1rem);opacity:0.6;display:flex;align-items:center;gap:0.3em}
#landscape .extras{font-size:clamp(0.45rem,2.3vmin,0.9rem);opacity:0.6;display:flex;align-items:center;gap:0.8em}

[hidden]{display:none!important}
</style>
</head>
<body>

<!-- Portrait -->
<div id="portrait" hidden>
  <div class="icon-wrap"><canvas id="p-canvas"></canvas></div>
  <div class="meta">
    <div class="location" id="p-location">－</div>
    <div class="temperature" id="p-temp">－°C</div>
    <div class="description" id="p-desc">載入中…</div>
    <div class="pop">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="1em" height="1em"><path d="M12 2C6.48 2 2 8.48 2 13a10 10 0 0 0 20 0c0-4.52-4.48-11-10-11z"/></svg>
      <span id="p-pop">－%</span>
    </div>
    <div class="extras">
      <span>UV <span id="p-uv">―</span></span>
      <span>空品 <span id="p-aqi">―</span></span>
      <span>PM2.5 <span id="p-pm25">―</span></span>
    </div>
  </div>
</div>

<!-- Landscape -->
<div id="landscape" hidden>
  <div class="icon-wrap"><canvas id="l-canvas"></canvas></div>
  <div class="meta">
    <div class="location" id="l-location">－</div>
    <div class="temperature" id="l-temp">－°C</div>
    <div class="description" id="l-desc">載入中…</div>
    <div class="pop">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="1em" height="1em"><path d="M12 2C6.48 2 2 8.48 2 13a10 10 0 0 0 20 0c0-4.52-4.48-11-10-11z"/></svg>
      <span id="l-pop">－%</span>
    </div>
    <div class="extras">
      <span>UV <span id="l-uv">―</span></span>
      <span>空品 <span id="l-aqi">―</span></span>
      <span>PM2.5 <span id="l-pm25">―</span></span>
    </div>
  </div>
</div>

    if (w > 0 && h > 0) { c.width = w; c.height = h; }
  });
}

// ── Skycons setup ──────────────────────────────────────────────────────────
var skycons = null;
var currentIcon = null;

function initSkycons(icon) {
  currentIcon = icon;
  if (skycons) skycons.pause();
  skycons = new Skycons({ color: iconColor });
  var canvasId = isLandscape ? 'l-canvas' : 'p-canvas';
  skycons.add(canvasId, icon);
  skycons.play();
}

function weatherToIcon(desc) {
  if (!desc) return Skycons.CLOUDY;
  if (desc.indexOf('晴天') >= 0 || desc.indexOf('晴朗') >= 0) return Skycons.CLEAR_DAY;
  if (desc.indexOf('晴') >= 0 && desc.indexOf('多雲') < 0)   return Skycons.CLEAR_DAY;
  if (desc.indexOf('雪') >= 0)                                 return Skycons.SNOW;
  if (desc.indexOf('雨') >= 0 || desc.indexOf('雷') >= 0)      return Skycons.RAIN;
  if (desc.indexOf('霧') >= 0 || desc.indexOf('霾') >= 0)      return Skycons.FOG;
  if (desc.indexOf('多雲') >= 0 || desc.indexOf('晴時') >= 0)  return Skycons.PARTLY_CLOUDY_DAY;
  if (desc.indexOf('陰') >= 0)                                 return Skycons.CLOUDY;
  return Skycons.CLOUDY;
}

// ── AQI label (European AQI scale) ────────────────────────────────────────
function aqiLabel(aqi) {
  var n = parseInt(aqi);
  if (isNaN(n) || aqi === '--') return '―';
  if (n <= 20)  return '優';
  if (n <= 40)  return '良';
  if (n <= 60)  return '普通';
  if (n <= 80)  return '差';
  if (n <= 100) return '很差';
  return '極差';
}

// ── UI update ──────────────────────────────────────────────────────────────
function updateUI(location, temp, desc, pop, uv, aqi, pm25) {
  ['p','l'].forEach(function(pfx) {
    document.getElementById(pfx + '-location').textContent = location;
    document.getElementById(pfx + '-temp').textContent     = temp + '°C';
    document.getElementById(pfx + '-desc').textContent     = desc;
    document.getElementById(pfx + '-pop').textContent      = pop + '%';
    document.getElementById(pfx + '-uv').textContent       = (uv  && uv  !== '--') ? uv  : '―';
    document.getElementById(pfx + '-aqi').textContent      = aqiLabel(aqi);
    document.getElementById(pfx + '-pm25').textContent     = (pm25 && pm25 !== '--') ? pm25 + ' μg/m³' : '―';
  });
  var shortDesc = desc.split('。')[0];
  initSkycons(weatherToIcon(shortDesc));
}

// ── Weather fetch via Supabase Edge Function (avoids CORS issues) ─────────
var EDGE_URL = 'https://narhbpojjtnalyfiwxue.supabase.co/functions/v1/weather';

function fetchWeather() {
  var url = EDGE_URL
    + '?locationName=' + encodeURIComponent(county)
    + '&regionName='   + encodeURIComponent(district);

  fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.error) throw new Error(d.error);
      try { localStorage.setItem('tw_weather_cache', JSON.stringify({ loc: d.location, temp: d.temp, wx: d.wx, pop: d.pop, uv: d.uv, aqi: d.aqi, pm25: d.pm25, ts: Date.now() })); } catch(e) {}
      updateUI(d.location, d.temp, d.wx, d.pop, d.uv, d.aqi, d.pm25);
    })
    .catch(function(err) {
      var cached = null;
      try { cached = JSON.parse(localStorage.getItem('tw_weather_cache') || 'null'); } catch(e) {}
      if (cached) updateUI(cached.loc, cached.temp, cached.wx, cached.pop, cached.uv, cached.aqi, cached.pm25);
      else updateUI(county + ' ' + district, '--', '無法連線', '--', '--', '--', '--');
    });
}

// ── Hourly refresh ─────────────────────────────────────────────────────────
setInterval(function() {
  var now = new Date();
  if (now.getMinutes() === 0 && now.getSeconds() === 0) fetchWeather();
}, 1000);

// ── Init ───────────────────────────────────────────────────────────────────
window.addEventListener('load', function() {
  applyLayout();
  fetchWeather();
});
window.addEventListener('resize', function() {
  applyLayout();
  requestAnimationFrame(function() { resizeCanvas(); });
});
</script>
