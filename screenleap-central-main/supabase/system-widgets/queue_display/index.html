<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queue Display</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f172a;
    --text:      #ffffff;
    --accent:    #f97316;
    --muted:     rgba(255,255,255,0.55);
    --lbl-color: rgba(255,255,255,0.55);
    /* Font sizes — overridden by JS from URL params (cqi = container inline-size) */
    --num-size:  22cqi;
    --hdr-size:   5cqi;
    --sub-size:   4cqi;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
  }

  /* container-type:inline-size → cqi units scale by WIDTH (matches React preview) */
  #app {
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.3em;
    padding: 6%;
    container-type: inline-size;
  }

  /* ── Header bar ── */
  #header {
    display: flex;
    align-items: center;
    gap: 0.4em;
    font-size: var(--hdr-size);
    font-weight: 600;
    color: var(--lbl-color);
    width: 100%;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    padding-bottom: 0.3em;
    margin-bottom: 0.2em;
  }
  #header .dot {
    width: 0.55em; height: 0.55em;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  #queue-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

  /* ── Main number ── */
  #number {
    font-size: var(--num-size);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--text);
    text-align: center;
  }

  /* ── Sub-label: counter name ── */
  #counter-row {
    display: flex;
    align-items: center;
    gap: 0.4em;
    font-size: var(--sub-size);
    color: var(--muted);
    min-height: 1.2em;
  }

  /* ── Pagination dots ── */
  #dots {
    display: flex;
    gap: 4px;
    margin-top: 0.3em;
  }
  #dots span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    transition: background .3s;
  }
  #dots span.active { background: var(--accent); }

  /* ── TTS toggle ── */
  #tts-btn {
    position: fixed; bottom: 4px; right: 4px;
    background: none; border: none;
    color: rgba(255,255,255,0.3);
    cursor: pointer;
    font-size: var(--sub-size);
    padding: 2px;
    line-height: 1;
    transition: color .2s;
  }
  #tts-btn:hover { color: rgba(255,255,255,0.7); }
  #tts-btn.on    { color: var(--accent); }

  /* ── Status / error ── */
  #status {
    font-size: var(--sub-size);
    color: var(--muted);
    text-align: center;
    display: none;
  }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <span class="dot"></span>
    <span id="queue-label">Queue</span>
  </div>
  <div id="number">—</div>
  <div id="counter-row">
    <span id="counter-label"></span>
  </div>
  <div id="dots"></div>
  <div id="status">connecting…</div>
</div>
<button id="tts-btn" title="點擊啟用語音">🔇</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
'use strict';

// ── URL params ─────────────────────────────────────────────────────────────
const p            = new URLSearchParams(location.search);
const ORG_ID       = p.get('orgId')       || '';
const TTS_LANG     = p.get('ttsLang')     || 'zh-TW';
const CYCLE_SEC    = Math.max(3, parseInt(p.get('cycleSeconds') || '8', 10));
const BG_COLOR     = p.get('bgColor')     || null;
const TEXT_COLOR   = p.get('textColor')   || null;
const ACCENT_COLOR = p.get('accentColor') || null;
const LABEL_COLOR  = p.get('labelColor')  || null;
const TEAM_ID      = p.get('teamId')      || '';

// Support repeated params (?queueIds=a&queueIds=b) AND comma-joined (?queueIds=a,b)
const QUEUE_IDS = p.getAll('queueIds')
  .flatMap(v => v.split(',').map(s => s.trim())).filter(Boolean);
const COUNTER_NAMES = p.getAll('counterNames')
  .flatMap(v => v.split(',').map(s => s.trim())).filter(Boolean);

const NUM_SIZE = parseFloat(p.get('numSize')      || '22');
const HDR_SIZE = parseFloat(p.get('labelSize')    || '5');
const SUB_SIZE = parseFloat(p.get('subLabelSize') || '4');

// ── CSS variables ──────────────────────────────────────────────────────────
const R = document.documentElement;
if (BG_COLOR)     R.style.setProperty('--bg',        BG_COLOR);
if (TEXT_COLOR)   R.style.setProperty('--text',      TEXT_COLOR);
if (ACCENT_COLOR) R.style.setProperty('--accent',    ACCENT_COLOR);
if (LABEL_COLOR)  R.style.setProperty('--lbl-color', LABEL_COLOR);
R.style.setProperty('--num-size', NUM_SIZE + 'cqi');
R.style.setProperty('--hdr-size', HDR_SIZE + 'cqi');
R.style.setProperty('--sub-size', SUB_SIZE + 'cqi');

// ── Supabase ───────────────────────────────────────────────────────────────
const { createClient } = window.supabase;
const sb = createClient(
  'https://narhbpojjtnalyfiwxue.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hcmhicG9qanRuYWx5Zml3eHVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMDAzNTMsImV4cCI6MjA5Mjg3NjM1M30.vGhaM-46pOemCxe-4EQcCBzYVcIv6i3HPCPwzC0bXbw',
  { realtime: { params: { eventsPerSecond: 5 } } }
);

// ── State ──────────────────────────────────────────────────────────────────
let allQueues  = [];   // all queues from DB, ordered by created_at
let activeIdx  = 0;    // current index in allQueues
let ticketMap  = {};   // { [queueId]: latestCallingTicket | null }
let ttsEnabled = false;
let announcedIds = new Set();
let cycleTimer   = null;
let rtChannel    = null;

// ── DOM refs ───────────────────────────────────────────────────────────────
const $number  = document.getElementById('number');
const $label   = document.getElementById('queue-label');
const $counter = document.getElementById('counter-label');
const $dots    = document.getElementById('dots');
const $status  = document.getElementById('status');
const $ttsBtn  = document.getElementById('tts-btn');

// ── TTS ────────────────────────────────────────────────────────────────────
$ttsBtn.addEventListener('click', () => {
  ttsEnabled = !ttsEnabled;
  $ttsBtn.textContent = ttsEnabled ? '🔊' : '🔇';
  $ttsBtn.classList.toggle('on', ttsEnabled);
  if (ttsEnabled && 'speechSynthesis' in window) {
    const w = new SpeechSynthesisUtterance(' ');
    w.volume = 0;
    speechSynthesis.speak(w);
  }
});

function speak(text) {
  if (!ttsEnabled || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang  = TTS_LANG;
  u.rate  = 0.9;
  speechSynthesis.speak(u);
}

function tryAnnounce(ticket, prefix) {
  if (announcedIds.has(ticket.id)) return;
  announcedIds.add(ticket.id);
  const num     = String(ticket.number).padStart(3, '0');
  const counter = ticket.counter_name || '';
  let text;
  if (TTS_LANG.startsWith('zh'))
    text = `請 ${prefix}${num} 號，到 ${counter || '服務台'}`;
  else if (TTS_LANG.startsWith('ja'))
    text = `${prefix}${num}番のお客様、${counter || 'カウンター'}へどうぞ`;
  else
    text = `Now serving ${prefix}${num} at ${counter || 'the counter'}`;
  speak(text);
}

// ── Helpers ────────────────────────────────────────────────────────────────

/** Returns true if queue q has any data worth showing */
function queueHasData(q) {
  return !!(ticketMap[q.id] || q.current_number > 0);
}

/** Render the currently-active queue */
function render() {
  const q = allQueues[activeIdx];
  if (!q) return;

  const ticket  = ticketMap[q.id];
  const prefix  = q.prefix ?? '';
  const num     = ticket?.number ?? q.current_number ?? 0;
  const dispNum = num > 0 ? `${prefix}${String(num).padStart(3, '0')}` : '—';

  $number.textContent  = dispNum;
  $label.textContent   = q.queue_name ?? '—';
  $counter.textContent = ticket?.counter_name ?? '';

  // Dots reflect ALL queues; active dot = current
  $dots.innerHTML = allQueues.map((_, i) =>
    `<span class="${i === activeIdx ? 'active' : ''}"></span>`
  ).join('');
}

// ── Realtime ───────────────────────────────────────────────────────────────

/** Called on any ticket INSERT or UPDATE — re-fetches latest for that queue */
async function handleTicketChange(t) {
  const queue = allQueues.find(q => q.id === t.queue_id);
  if (!queue) return;

  // Re-fetch the latest 'calling' ticket for this specific queue
  let q = sb
    .from('queue_system_tickets')
    .select('id, queue_id, number, status, counter_name, called_at')
    .eq('queue_id', t.queue_id)
    .eq('status', 'calling')
    .order('called_at', { ascending: false })
    .limit(1);
  if (COUNTER_NAMES.length > 0) q = q.in('counter_name', COUNTER_NAMES);
  const { data } = await q;
  const latest = data?.[0] ?? null;

  const prev = ticketMap[t.queue_id];
  ticketMap[t.queue_id] = latest;

  // Announce if a new calling ticket just arrived
  if (latest && t.status === 'calling' && (!prev || latest.id !== prev.id)) {
    tryAnnounce(latest, queue.prefix ?? '');
  }

  // Re-render if this queue is the one currently on screen
  if (allQueues[activeIdx]?.id === t.queue_id) render();
}

async function subscribeAll(qIds) {
  if (rtChannel) { await sb.removeChannel(rtChannel); rtChannel = null; }
  if (!qIds.length) return;

  // Subscribe to the whole table; filter in JS (simpler than per-queue channels)
  rtChannel = sb.channel('qd-all')
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'queue_system_tickets' },
      ({ new: t }) => handleTicketChange(t))
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'queue_system_tickets' },
      ({ new: t }) => handleTicketChange(t))
    .subscribe();
}

// ── Cycling ────────────────────────────────────────────────────────────────

/** Advance to next queue, skipping queues with no data (if any queue has data) */
function cycleNext() {
  const total = allQueues.length;
  if (total <= 1) return;

  const hasAnyData = allQueues.some(queueHasData);
  let nextIdx = (activeIdx + 1) % total;

  if (hasAnyData) {
    // Skip queues with no data; guard against infinite loop
    for (let i = 0; i < total; i++) {
      const candidate = (activeIdx + 1 + i) % total;
      if (queueHasData(allQueues[candidate])) {
        nextIdx = candidate;
        break;
      }
    }
  }

  activeIdx = nextIdx;
  render();
}

function startCycle() {
  if (cycleTimer) clearInterval(cycleTimer);
  if (allQueues.length <= 1) return;
  cycleTimer = setInterval(cycleNext, CYCLE_SEC * 1000);
}

// ── Bootstrap ──────────────────────────────────────────────────────────────
async function init() {
  if (!ORG_ID) {
    $number.textContent   = 'N/A';
    $status.style.display = 'block';
    $status.textContent   = 'orgId missing';
    return;
  }

  $status.style.display = 'block';

  // 1. Load queue list
  let qQuery = sb
    .from('queue_system_queues')
    .select('id, queue_name, prefix, current_number')
    .eq('org_id', ORG_ID);

  if (QUEUE_IDS.length > 0) {
    qQuery = qQuery.in('id', QUEUE_IDS);
  } else if (TEAM_ID) {
    qQuery = qQuery.eq('team_id', TEAM_ID);
  }
  qQuery = qQuery.order('created_at');

  const { data: queues, error } = await qQuery;
  $status.style.display = 'none';

  if (error || !queues?.length) {
    $number.textContent = '—';
    $label.textContent  = error ? 'Error' : 'No queues';
    return;
  }

  allQueues = queues;
  const qIds = allQueues.map(q => q.id);

  // 2. Batch-fetch latest calling ticket for ALL queues in one query
  let tQuery = sb
    .from('queue_system_tickets')
    .select('id, queue_id, number, status, counter_name, called_at')
    .in('queue_id', qIds)
    .eq('status', 'calling')
    .order('called_at', { ascending: false });
  if (COUNTER_NAMES.length > 0) tQuery = tQuery.in('counter_name', COUNTER_NAMES);
  const { data: tickets } = await tQuery;

  // Build ticketMap: keep only the latest ticket per queue
  ticketMap = {};
  for (const t of (tickets ?? [])) {
    if (!ticketMap[t.queue_id]) ticketMap[t.queue_id] = t;
  }

  // 3. Start at the first queue that has data; fall back to queue 0
  const firstWithData = allQueues.find(queueHasData);
  activeIdx = firstWithData ? allQueues.indexOf(firstWithData) : 0;

  render();

  // 4. Subscribe realtime for all queues
  await subscribeAll(qIds);

  // 5. Cycle
  startCycle();
}

init();
</script>
</body>
</html>
