# ─────────────────────────────────────────────────────────────────────────────
# Mosquitto configuration — rcc.signcms.net
# SignCMS Digital Signage MQTT Broker
# ─────────────────────────────────────────────────────────────────────────────

# ── TCP MQTT / TLS (port 18883) ───────────────────────────────────────────────
# Used by:
#   - Android player  (Paho MqttAsyncClient, ssl://rcc.signcms.net:18883)
#   - Electron player (npm:mqtt,             mqtts://rcc.signcms.net:18883)
#   - Edge Functions  (npm:mqtt,             mqtts://rcc.signcms.net:18883)
listener 18883
protocol mqtt

# TLS — replace with your actual certificate paths
cafile   /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile  /etc/mosquitto/certs/server.key
tls_version tlsv1.2

# ── HTTP Authentication backend (mosquitto-go-auth plugin) ───────────────────
# Validates screen device tokens and server credentials.
# See: supabase/functions/mqtt-auth/index.ts
auth_plugin /usr/lib/mosquitto-go-auth.so

auth_opt_backends http
auth_opt_http_host     narhbpojjtnalyfiwxue.supabase.co
auth_opt_http_port     443
auth_opt_http_getuser_uri  /functions/v1/mqtt-auth/user
auth_opt_http_aclcheck_uri /functions/v1/mqtt-auth/acl
auth_opt_http_superuser_uri /functions/v1/mqtt-auth/superuser

auth_opt_http_with_tls true
auth_opt_http_timeout  10

# Authorization header sent to the HTTP backend so mqtt-auth can verify
# this is a legitimate Mosquitto request (not a spoofed call).
# Must match MQTT_SERVER_PASS Supabase secret.
auth_opt_http_params_mode json
auth_opt_http_resp_params_mode json

# ── Persistence ───────────────────────────────────────────────────────────────
# Required for retained messages (shadow/delta) to survive broker restarts.
persistence true
persistence_location /var/lib/mosquitto/

# ── Logging ───────────────────────────────────────────────────────────────────
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# ── Limits ────────────────────────────────────────────────────────────────────
max_keepalive 60
max_packet_size 65536
message_size_limit 65536

# Persistent sessions: broker queues QoS 1 messages for offline devices.
# This enables shadow/delta delivery after the device reconnects.
# max_inflight_messages 0   (unlimited; tweak for high-device-count deployments)
