# ─────────────────────────────────────────────────────────────────────────────
# Mosquitto configuration — mqtt.signcms.net
# SignCMS Digital Signage MQTT Broker
#
# Sized for 10,000 concurrent device connections + ~10 server publishers.
# See docs/runbooks/mosquitto-scaling.md for OS-level tuning (ulimit, sysctl).
# ─────────────────────────────────────────────────────────────────────────────

# ── TCP MQTT / TLS (port 18884) ───────────────────────────────────────────────
# Used by:
#   - Android player  (Paho MqttAsyncClient, ssl://mqtt.signcms.net:18884)
#   - Electron player (npm:mqtt,             mqtts://mqtt.signcms.net:18884)
#   - Edge Functions  (npm:mqtt,             mqtts://mqtt.signcms.net:18884)
listener 18884
protocol mqtt

# TLS — replace with your actual certificate paths
cafile   /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile  /etc/mosquitto/certs/server.key
tls_version tlsv1.2

# ── Access control ───────────────────────────────────────────────────────────
# IMPORTANT: set to false once mqtt-auth backend is confirmed working.
# While true, anyone can connect without credentials (INSECURE).
allow_anonymous false

# ── HTTP Authentication backend (mosquitto-go-auth plugin) ───────────────────
# Validates screen device tokens and server credentials.
# See: supabase/functions/mqtt-auth/index.ts
auth_plugin /usr/lib/mosquitto-go-auth.so

auth_opt_backends http
auth_opt_http_host     narhbpojjtnalyfiwxue.supabase.co
auth_opt_http_port     443
auth_opt_http_getuser_uri  /functions/v1/mqtt-auth/user
auth_opt_http_aclcheck_uri /functions/v1/mqtt-auth/acl
auth_opt_http_superuser_uri /functions/v1/mqtt-auth/superuser

auth_opt_http_with_tls true
auth_opt_http_timeout  10

auth_opt_http_params_mode json
auth_opt_http_resp_params_mode json

# ── Auth cache (CRITICAL for 10k device scale) ───────────────────────────────
# Without these, every MQTT connect / publish / subscribe triggers an HTTPS
# call to the mqtt-auth edge function. A broker restart with 10k devices
# reconnecting would generate 10k+ simultaneous Supabase invocations and
# likely exceed edge-function concurrency limits.
#
# Cache layout:
#   auth_cache_seconds        — how long an authenticated user/password
#                                pair is trusted without re-validating.
#   acl_cache_seconds         — same for ACL checks (every publish/subscribe).
#   auth_jitter_seconds       — random 0–N second offset on cache expiry to
#                                spread re-validation load.
#   auth_cache_reset_on_hit   — extend the cache on every hit (recommended).
#
# 300s for both is conservative; devices reconnect rarely so re-auth is
# infrequent. Increase to 1800–3600 if Supabase invocation cost is high.
auth_opt_cache_type           ristretto
auth_opt_auth_cache_seconds   300
auth_opt_acl_cache_seconds    300
auth_opt_auth_jitter_seconds  30
auth_opt_acl_jitter_seconds   30
auth_opt_auth_cache_reset_on_hit true

# Retry on transient Supabase 5xx so a brief edge function blip doesn't
# disconnect everyone. Defaults to 3 retries with exponential back-off.
auth_opt_http_retry_count   3
auth_opt_http_retry_backoff 500ms

# ── Persistence ───────────────────────────────────────────────────────────────
# Required for retained messages (shadow/delta) to survive broker restarts.
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval    1800
autosave_on_changes  false

# ── Logging ───────────────────────────────────────────────────────────────────
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
# Drop subscription log type when running 10k devices — generates ~1MB/min.
# log_type subscribe

# ── Connection limits (10k device target) ────────────────────────────────────
# `max_connections -1` lifts the broker-level cap; the real limit becomes
# the kernel ulimit (see runbook). Each connection ≈ 8KB resident memory.
max_connections -1
max_keepalive   60
max_inflight_messages 100
max_queued_messages   1000
queue_qos0_messages   true

# Drop pre-CONNACK clients after 10s — defends against slow-loris.
# (mosquitto 2.0+ supports this; comment out for older versions.)
# connection_timeout 10

# ── Per-message limits ────────────────────────────────────────────────────────
# Player heartbeats and shadow deltas are tiny (<1KB).  64KB is plenty;
# we cap it to make abuse / malformed clients cheap to reject.
max_packet_size 65536
message_size_limit 65536

# ── Performance tuning ────────────────────────────────────────────────────────
# Use one worker per connection (default) for predictable latency.
# `set_tcp_nodelay` reduces command latency at the cost of slightly more
# packet headers — worth it for our small heartbeat / command messages.
set_tcp_nodelay true

# ── Health probe ──────────────────────────────────────────────────────────────
# Optional second listener for internal load balancer / Kubernetes probes.
# Plain TCP (no TLS), localhost only, no auth. Comment out if not needed.
#
# listener 1884 127.0.0.1
# protocol mqtt
# allow_anonymous true
# require_certificate false
