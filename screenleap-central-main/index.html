    <script>
      // Apply saved theme class before React mounts to prevent FOUC on first paint.
      (function () {
        try {
          var m = document.cookie.match(/(?:^|;\s*)user_theme=(dark|light)/);
          var t = m ? m[1] : (localStorage.getItem('signboard-theme') || 'light');
          if (t !== 'dark' && t !== 'light') t = 'light';
          document.documentElement.classList.add(t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
