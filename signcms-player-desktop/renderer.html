<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignCMS Player</title>
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: system-ui, sans-serif; }

/* ── Zone layout ── */
#stage { position: absolute; inset: 0; }

.zone {
  position: absolute;
  overflow: hidden;
  background: #111;
}
/* Default display for zone media — specific fit modes are set via inline styles */
.zone video, .zone img { display: block; }
.zone video {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
}

/* ── No-content splash ── */
#splash {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: #0a0a0a;
  gap: 16px;
}
#splash.hidden { display: none; }
#splash h1 { font-size: 2rem; font-weight: 300; color: #fff; }
#splash p  { color: #666; font-size: 0.9rem; }
#splash .config-btn {
  margin-top: 12px; padding: 10px 28px;
  background: #2563eb; color: #fff; border: none;
  border-radius: 6px; cursor: pointer; font-size: 0.9rem;
}
#splash .config-btn:hover { background: #1d4ed8; }


/* ── HUD overlay (F1 or triple-click) ── */
#hud {
  position: fixed; top: 0; right: 0;
  width: 340px;
  background: rgba(0,0,0,.9);
  border-left: 1px solid #333;
  height: 100%;
  overflow-y: auto;
  padding: 16px;
  z-index: 100;
  display: none;
  font-size: 12px;
}
#hud.visible { display: block; }
#hud h2 { font-size: 13px; font-weight: 600; color: #f0f0f0; margin-bottom: 12px; letter-spacing: .05em; }
#hud .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #222; }
#hud .row .label { color: #888; }
#hud .row .val   { color: #e0e0e0; text-align: right; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#hud .pill {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 600; margin-left: 4px;
}
#hud .pill.ok    { background: #16a34a22; color: #4ade80; }
#hud .pill.warn  { background: #d9770622; color: #fb923c; }
#hud .pill.error { background: #dc262622; color: #f87171; }
#hud .pill.info  { background: #2563eb22; color: #60a5fa; }
#hud .pill.grey  { background: #33333366; color: #9ca3af; }

#hud .section-title { color: #555; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; margin: 12px 0 4px; }

#hud .btn-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
#hud button {
  flex: 1; min-width: 80px; padding: 6px 10px;
  background: #1f2937; border: 1px solid #374151;
  color: #d1d5db; border-radius: 5px; cursor: pointer; font-size: 11px;
}
#hud button:hover  { background: #374151; }
#hud button.active { background: #1e3a5f; border-color: #2563eb; color: #93c5fd; }

#hud #log-container {
  margin-top: 10px; max-height: 220px; overflow-y: auto;
  font-size: 10px; color: #6b7280;
  font-family: 'SF Mono', 'Cascadia Code', monospace;
}
#hud #log-container div { padding: 2px 0; border-bottom: 1px solid #111; }
#hud #log-container .err { color: #f87171; }
#hud #log-container .ok  { color: #4ade80; }

#progress-bar {
  position: fixed; top: 0; left: 0; right: 0; height: 3px;
  background: transparent; z-index: 200;
  pointer-events: none;
}
#progress-bar .fill {
  height: 100%; width: 0%; background: #3b82f6;
  transition: width .2s;
}

#hud-hint {
  position: fixed; bottom: 8px; right: 8px;
  font-size: 10px; color: #333; pointer-events: none;
  z-index: 50;
}
</style>
</head>
<body>

<div id="progress-bar"><div class="fill" id="pb-fill"></div></div>

<!-- Content area -->
<div id="stage"></div>

<!-- No-content splash -->
<div id="splash">
  <h1>SignCMS Player</h1>
  <p id="splash-msg">Connecting to server…</p>
  <button class="config-btn" onclick="window.player.openSettings()">Open Settings</button>
</div>


<!-- HUD -->
<div id="hud">
  <h2>SignCMS HUD <span id="hud-ver" style="color:#555;font-weight:400"></span></h2>

  <div class="section-title">Connection</div>
  <div class="row"><span class="label">Server</span><span class="val" id="h-server">—</span></div>
  <div class="row"><span class="label">Device Token</span><span class="val" id="h-token">—</span></div>
  <div class="row"><span class="label">Screen</span><span class="val" id="h-screen">—</span></div>
  <div class="row"><span class="label">Sync</span><span class="val" id="h-sync">—</span></div>
  <div class="row"><span class="label">Realtime</span><span class="val" id="h-rt">—</span></div>

  <div class="section-title">Content</div>
  <div class="row"><span class="label">Channel</span><span class="val" id="h-channel">—</span></div>
  <div class="row"><span class="label">Project</span><span class="val" id="h-project">—</span></div>
  <div class="row"><span class="label">Last Sync</span><span class="val" id="h-last-sync">—</span></div>

  <!-- Layout Switcher — hidden when channel has only 1 layout -->
  <div id="hud-layout-section" style="display:none">
    <div class="section-title">版型切換</div>
    <div id="hud-layout-btns" class="btn-row"></div>
  </div>

  <!-- Page Transition Conditions — visible when project has pageTransition config -->
  <div id="hud-pagetrans-section" style="display:none">
    <div class="section-title">版型切換條件</div>
    <div class="row"><span class="label">模式</span><span class="val" id="h-pt-mode">—</span></div>
    <div class="row" id="h-pt-countdown-row" style="display:none">
      <span class="label">倒計時</span><span class="val" id="h-pt-countdown">—</span>
    </div>
    <div class="row"><span class="label">觸發</span><span class="val" id="h-pt-triggers">—</span></div>
    <div id="h-pt-codes-section" style="display:none">
      <div class="row"><span class="label">遙控碼</span><span class="val" id="h-pt-codes">—</span></div>
    </div>
    <div class="btn-row" id="h-pt-btns" style="margin-top:6px"></div>
  </div>

  <div class="section-title">CAS Cache</div>
  <div class="row"><span class="label">Sync</span><span class="val" id="h-cas-pct">—</span></div>
  <div class="row"><span class="label">Files</span><span class="val" id="h-cas-files">—</span></div>
  <div class="row"><span class="label">Size on Disk</span><span class="val" id="h-cas-size">—</span></div>
  <div class="row"><span class="label">Failures</span><span class="val" id="h-cas-fail">—</span></div>
  <div class="row"><span class="label">Cache Dir</span><span class="val" id="h-cas-dir">—</span></div>

  <div class="section-title">Window</div>
  <div class="row">
    <span class="label">Aspect Ratio</span>
    <span class="val" id="h-aspect">—</span>
  </div>
  <div class="btn-row" style="margin-top:6px">
    <button id="ar-btn-16-9" onclick="doSetAspectRatio('16:9')">16:9</button>
    <button id="ar-btn-9-16" onclick="doSetAspectRatio('9:16')">9:16</button>
    <button id="ar-btn-free" onclick="doSetAspectRatio('free')">Free</button>
  </div>

  <div class="btn-row">
    <button onclick="doForceSync()">Force Sync</button>
    <button onclick="window.player.openSettings()">Settings</button>
    <button onclick="refreshHud()">Refresh HUD</button>
    <button onclick="doVerify()">Verify CAS</button>
    <button onclick="window.player.openCasDir()">Open CAS Dir</button>
    <button onclick="doRestart()" style="background:#7f1d1d;border-color:#991b1b;color:#fca5a5;">Restart Player</button>
    <button onclick="doUpdate()"  style="background:#14532d;border-color:#166534;color:#86efac;">Update Software</button>
  </div>

  <div class="section-title">Event Log</div>
  <div id="log-container"></div>
</div>

<div id="hud-hint">F1 — HUD</div>

<script>
'use strict';

// ── State ─────────────────────────────────────────────────────────────────────
let currentProject       = null;
let currentDefaultMediaId = null;
let currentOrgId         = null;   // set from data.screen.org_id on each sync
let hudVisible           = false;
let lastSyncTime         = null;
let realtimeConnected    = false;
let dlDone = 0, dlTotal  = 0;
// '16:9' | '9:16' | 'free'
let currentAspectRatio   = 'free';
// true after the user has manually chosen a ratio — suppresses auto-detect
let aspectManuallySet    = false;
// Multi-layout support — populated when channel has ≥2 allowed projects
let availableLayouts     = [];   // [{id, name, zones, updated_at}] sorted by sort_order
let activeLayoutId       = null; // null = follow server's choice; string = manual override
// Page-level layouts — extracted from _meta.pages inside a single design project
let pageLayouts          = [];   // [{id, name, zones, overlays}] from _meta.pages
let activePageId         = null; // currently displayed page; null = use _meta.activePageId default
// Auto-switch state (pageTransition.mode === 'auto')
let pageAutoInterval  = null;  // setInterval handle (1-second tick)
let pageAutoSeconds   = 0;     // full interval configured in pageTransition.seconds
let pageAutoRemaining = 0;     // seconds left until next page advance
let pageAutoPaused    = false; // true while user has paused auto-switch
// Remote-code input buffer (pageTransition.triggers.remote)
let remoteCodeBuffer  = '';
let remoteCodeTimer   = null;

const zonePlayers = new Map(); // zoneId → ZonePlayer

// ── Startup ───────────────────────────────────────────────────────────────────
(async () => {
  const configured = await window.player.isConfigured();
  if (!configured) {
    setSplashMsg('Not configured — open Settings to begin.');
    return;
  }
  setSplashMsg('Connecting to SignCMS…');
})();

function setSplashMsg(msg) {
  document.getElementById('splash-msg').textContent = msg;
}

// ── SignCMS events ────────────────────────────────────────────────────────────
window.addEventListener('__signSyncData', (e) => {
  const data = e.detail;
  lastSyncTime  = new Date().toLocaleTimeString();
  currentOrgId  = data.screen?.org_id ?? null;   // needed for widget URL fallback
  log(`Sync OK — ${data.screen?.name ?? '?'} / ${data.channel?.name ?? '—'}`, 'ok');

  // Auto-detect aspect ratio from screen resolution settings (only if not manually set).
  // Server sends screen.resolution_width / resolution_height (or width/height) from the DB.
  if (!aspectManuallySet) {
    const rw = data.screen?.resolution_width  ?? data.screen?.width  ?? 0;
    const rh = data.screen?.resolution_height ?? data.screen?.height ?? 0;
    if (rw > 0 && rh > 0) {
      const r = rw / rh;
      const target = Math.abs(r - 16/9) < 0.05 ? '16:9'
                   : Math.abs(r - 9/16) < 0.05 ? '9:16'
                   : 'free';
      if (target !== currentAspectRatio) _applyAspectRatio(target, false);
    }
  }

  if (data.project) {
    currentDefaultMediaId = null;

    // ── Multi-layout: update local cache ──────────────────────────────────
    if (Array.isArray(data.layouts) && data.layouts.length >= 2) {
      availableLayouts = data.layouts;
    } else if (!data.layouts) {
      // Channel dropped to single layout — clear manual override
      availableLayouts = [];
      activeLayoutId   = null;
    }
    if (hudVisible) updateHudLayouts();

    // ── Determine which layout to render ──────────────────────────────────
    // If user manually picked one and it still exists → honour it.
    // Otherwise fall back to the server's currently-active project.
    const manualLayout = activeLayoutId
      ? availableLayouts.find(l => l.id === activeLayoutId) ?? null
      : null;
    const toRender = manualLayout ?? data.project;

    const needsRender = !currentProject
      || currentProject.id !== toRender.id
      || (!manualLayout && data.project.zones_changed !== false);

    if (needsRender) {
      currentProject = toRender;
      renderProject(toRender);
    }
    return;
  }

  if (data.default_media) {
    currentProject = null;
    if (data.default_media.id !== currentDefaultMediaId) {
      currentDefaultMediaId = data.default_media.id;
      renderDefaultMedia(data.default_media);
    }
    return;
  }

  // Sleep mode — pure black screen
  currentProject = null;
  currentDefaultMediaId = null;
  pageLayouts = []; activePageId = null;
  stopPageAutoSwitch(); pageAutoPaused = false;
  zonePlayersClear();
  document.getElementById('stage').innerHTML = '';
  hideSplash();
});

window.addEventListener('__signSyncError', (e) => {
  log(`Sync error: ${e.detail}`, 'err');
  setSplashMsg(`Sync error: ${e.detail}`);
});

window.addEventListener('__signRealtimeCmd', (e) => {
  const { event, payload } = e.detail;
  log(`Realtime: ${event}`);
  if (event === 'content.sync') { window.player.forceSync(); return; }

  // page.switch — API-triggered page switch (requires pageTransition.triggers.api === true)
  if (event === 'page.switch') {
    const pt = _getCurrentPageTransition();
    if (!pt?.triggers?.api) { log('page.switch 已忽略（API 觸發未啟用）'); return; }
    const targetId = payload?.page_id ?? null;
    if (targetId) {
      const page = pageLayouts.find(p => p.id === targetId);
      if (page) { doSwitchPage(targetId); return; }
    }
    // Fallback: switch by 0-based index
    if (typeof payload?.index === 'number') {
      const page = pageLayouts[payload.index % pageLayouts.length];
      if (page) doSwitchPage(page.id);
    }
  }
});

window.addEventListener('__signRealtimeStatus', (e) => {
  realtimeConnected = e.detail.connected;
  if (hudVisible) updateHudStatus();
});

window.addEventListener('__signDownloadProgress', (e) => {
  dlDone  = e.detail.done;
  dlTotal = e.detail.total;
  const pct = dlTotal > 0 ? dlDone / dlTotal : 0;
  document.getElementById('pb-fill').style.width = (pct * 100) + '%';
  if (dlDone >= dlTotal) setTimeout(() => {
    document.getElementById('pb-fill').style.width = '0%';
  }, 800);
});

window.addEventListener('__signCasReady', (e) => {
  log(`CAS ready: ${e.detail.count}/${e.detail.total} files`);
  if (currentProject) rerenderMediaSources();
});

window.addEventListener('__signVerifyProgress', (e) => {
  const { checked, total, sha256, ok } = e.detail;
  if (!ok) log(`Integrity FAIL: ${sha256.slice(0,16)}…`, 'err');
  if (checked === total) log(`Integrity check done: ${checked} files`, 'ok');
});

// ── Keyboard shortcut ─────────────────────────────────────────────────────────
let clickCount = 0, clickTimer = null;
document.addEventListener('keydown', (e) => {
  if (e.key === 'F1') { toggleHud(); return; }

  // Remote-code input: collect digit keypresses and match against pageChannels.
  // Supports multi-digit codes like "01" — a 400 ms silence fires the match.
  const pt = _getCurrentPageTransition();
  if (pt?.triggers?.remote && /^\d$/.test(e.key)) {
    remoteCodeBuffer += e.key;
    clearTimeout(remoteCodeTimer);
    remoteCodeTimer = setTimeout(() => {
      const code       = remoteCodeBuffer;
      remoteCodeBuffer = '';
      const channels   = pt.pageChannels ?? [];
      const matched    = channels.find(c => c.remoteCode === code);
      if (matched) {
        log(`遙控碼 ${code} → ${matched.name}`, 'ok');
        doSwitchPage(matched.id);
      } else {
        log(`遙控碼 ${code} — 無匹配版型`);
      }
    }, 400);
  }
});
document.addEventListener('click', () => {
  clickCount++;
  clearTimeout(clickTimer);
  clickTimer = setTimeout(() => { clickCount = 0; }, 600);
  if (clickCount >= 3) { clickCount = 0; toggleHud(); }
});

function toggleHud() {
  hudVisible = !hudVisible;
  document.getElementById('hud').classList.toggle('visible', hudVisible);
  if (hudVisible) refreshHud();
}

// ── Zone rendering ────────────────────────────────────────────────────────────
// forcePageId: pass when doSwitchPage triggers re-render so the new selection
// is applied before normaliseZones reads activePageId.
function renderProject(project, forcePageId = null) {
  const stage  = document.getElementById('stage');
  const splash = document.getElementById('splash');

  // Destroy old zone players
  zonePlayersClear();
  stage.innerHTML = '';
  splash.classList.add('hidden');
  // Stop any running auto-switch (startPageAutoSwitch will restart if still needed)
  stopPageAutoSwitch();

  // ── Extract page-level layouts from _meta.pages ───────────────────────────
  const zonesArr = Array.isArray(project.zones) ? project.zones : [];
  const metaObj  = zonesArr.find(z => z?._meta);

  if (metaObj?.pages?.length > 1) {
    pageLayouts = metaObj.pages;

    // Priority: explicit forcePageId > preserved activePageId (if still valid) >
    //           designer's last-saved activePageId > first page
    if (forcePageId && pageLayouts.find(p => p.id === forcePageId)) {
      activePageId = forcePageId;
    } else if (!activePageId || !pageLayouts.find(p => p.id === activePageId)) {
      activePageId = metaObj.activePageId ?? pageLayouts[0]?.id ?? null;
    }

    // Auto-switch between pages if designer configured it
    const pt = metaObj.pageTransition;
    if (pt?.mode === 'auto' && pt.seconds > 0 && !pageAutoPaused) {
      startPageAutoSwitch(pt.seconds);
    } else if (pt?.mode === 'auto' && pt.seconds > 0 && pageAutoPaused) {
      // Keep seconds in sync so Pause → Resume restores correct interval
      pageAutoSeconds = pt.seconds;
    }
  } else {
    pageLayouts  = [];
    activePageId = null;
    pageAutoPaused = false;
  }

  if (hudVisible) { updateHudLayouts(); updatePageTransHud(); }

  const zones = normaliseZones(project.zones, activePageId);
  if (!zones.length) {
    splash.classList.remove('hidden');
    setSplashMsg('Project has no zones.');
    return;
  }

  for (const zone of zones) {
    const div = document.createElement('div');
    div.className   = 'zone';
    div.id          = `zone-${zone.id}`;
    div.style.left    = pct(zone.x);
    div.style.top     = pct(zone.y);
    div.style.width   = pct(zone.w);
    div.style.height  = pct(zone.h);
    div.style.zIndex  = zone.zIndex ?? 0;
    // Apply designer bgColor when it doesn't use CSS variables
    if (zone.bgColor && !zone.bgColor.includes('var(--')) div.style.background = zone.bgColor;
    stage.appendChild(div);

    const player = new ZonePlayer(div, zone.items ?? []);
    zonePlayersAdd(zone.id, player);
    player.start();
  }
}

function hideSplash() {
  document.getElementById('splash').classList.add('hidden');
}

// Single full-screen asset (default_playback = 'media')
function renderDefaultMedia(media) {
  zonePlayersClear();
  document.getElementById('stage').innerHTML = '';
  hideSplash();

  const div = document.createElement('div');
  div.className    = 'zone';
  div.id           = 'zone-default';
  div.style.left   = '0%';
  div.style.top    = '0%';
  div.style.width  = '100%';
  div.style.height = '100%';
  document.getElementById('stage').appendChild(div);

  const item = normaliseItem({
    id:     media.id,
    url:    media.url,
    sha256: media.sha256 ?? null,
    type:   media.type   ?? null,
    dwell:  10,
  });
  const player = new ZonePlayer(div, [item]);
  zonePlayersAdd('default', player);
  player.start();
}

// When CAS download completes, swap CDN URLs for cas:// in running players
async function rerenderMediaSources() {
  for (const [, player] of zonePlayers) {
    await player.refreshCurrentSource();
  }
}

// ── Zones normalisation ───────────────────────────────────────────────────────
// Handles both percentage (0-100) and fractional (0-1) coordinate systems,
// as well as different key naming conventions from the CMS designer.
//
// The designer stores zones as:
//   [ { _meta:true, bgm:{…}, pages:[…], resolution:{w,h}, … },  ← config object (skip)
//     { id:"z1", x:0, y:0, w:69, h:100, content:{ mediaItems:[…] } },  ← % coords
//     { id:"z2", x:69, y:0, w:31, h:100, content:{ mediaItems:[…] } },
//     { id:"overlay-…", _overlay:true, x:33, y:295, w:168, h:109, … } ] ← PX coords!
//
// IMPORTANT: Overlay zones (_overlay:true) use ABSOLUTE PIXEL coordinates on the
// design canvas (e.g. 3840×2160). They must be converted to percentages using the
// canvas dimensions stored in _meta.resolution.
// Regular zones already use 0-100 percentage coordinates.
// currentPageId: when a project uses the new _meta.pages multi-layout format,
// pass the desired page ID so only that page's zones are rendered.
function normaliseZones(zones, currentPageId = null) {
  if (!zones) return [];
  const arr = Array.isArray(zones) ? zones : (zones.zones ?? Object.values(zones));

  // Extract canvas resolution from the _meta object for overlay coordinate conversion
  const meta    = arr.find(z => z?._meta);
  const canvasW = meta?.resolution?.width  ?? 1920;
  const canvasH = meta?.resolution?.height ?? 1080;

  // Overlay coordinates are stored in CSS pixels of the designer's display canvas.
  // The designer caps preview canvas height at 540 px, so the reference frame is:
  //   overlayRefH = 540
  //   overlayRefW = 540 × (canvasW / canvasH)  →  960 for 4K 16:9 (3840×2160)
  // (If the designer later stores explicit displayW/displayH in _meta, prefer those.)
  const overlayRefH = meta?.displayH ?? 540;
  const overlayRefW = meta?.displayW ?? Math.round(overlayRefH * canvasW / canvasH);

  let realZones;

  if (meta?.pages?.length > 0) {
    // ── New multi-page format: each page has its own zones + overlays ─────────
    // Select the target page by ID, fall back to _meta.activePageId or first page.
    const targetId = currentPageId ?? meta.activePageId ?? meta.pages[0]?.id;
    const page     = meta.pages.find(p => p.id === targetId) ?? meta.pages[0];
    // Mark overlay items so the coordinate branch below handles them correctly.
    const overlayItems = (page?.overlays ?? []).map(o => ({ ...o, _overlay: true }));
    realZones = [...(page?.zones ?? []), ...overlayItems];
  } else {
    // ── Legacy flat format: zones sit directly in the top-level array ─────────
    realZones = arr.filter(z => z && typeof z === 'object' && !z._meta && z.id);
  }

  return realZones.map((z, i) => {
    // Items live at different keys depending on the source:
    //   legacy player format  → z.items
    //   designer format       → z.content.mediaItems
    const items = z.items ?? z.mediaItems ?? z.media_items ?? z.playlist
               ?? z.content?.mediaItems ?? z.content?.items ?? [];
    // Zone-level fitMode (set via the designer toolbar) acts as a fallback
    // for items that don't have their own per-item fitMode.
    const zoneFitMode = z.fitMode ?? z.content?.fitMode ?? null;

    let x, y, w, h;
    if (z._overlay) {
      // Overlay coords are in display-canvas px (designer caps height at 540 px) → convert to %
      x = (coerce(z.x ?? 0)              / overlayRefW) * 100;
      y = (coerce(z.y ?? 0)              / overlayRefH) * 100;
      w = (coerce(z.w ?? z.width  ?? 0)  / overlayRefW) * 100;
      h = (coerce(z.h ?? z.height ?? 0)  / overlayRefH) * 100;
    } else {
      x = normaliseCoord(coerce(z.x ?? z.left  ?? 0));
      y = normaliseCoord(coerce(z.y ?? z.top   ?? 0));
      w = normaliseSize (coerce(z.w ?? z.width  ?? z.right  ?? 100));
      h = normaliseSize (coerce(z.h ?? z.height ?? z.bottom ?? 100));
    }

    return {
      id:      z.id ?? `z${i}`,
      x, y, w, h,
      zIndex:  z.zIndex ?? (z._overlay ? 10 : 0),
      bgColor: z.bgColor ?? z.content?.bgColor ?? null,
      items:   items.map(item => normaliseItem(item, zoneFitMode)),
    };
  });
}

// zoneFitMode: optional zone-level fitMode from z.content.fitMode, used as
// fallback when an individual item doesn't carry its own fitMode.
function normaliseItem(item, zoneFitMode = null) {
  const type = item.type ?? (item.url?.match(/\.(mp4|webm|mov|avi)$/i) ? 'video' : 'image');

  // Widgets: the playback URL is in widgetConfig.url, with optional query params
  let url = item.url ?? item.src ?? '';
  if (type === 'widget' && item.widgetConfig?.url) {
    try {
      const u = new URL(item.widgetConfig.url);
      if (item.widgetConfig.params) {
        for (const [k, v] of Object.entries(item.widgetConfig.params)) {
          if (v !== '' && v != null) u.searchParams.set(k, String(v));
        }
      }
      url = u.toString();
    } catch { url = item.widgetConfig.url; }
  }

  // Fallback: widget has no stored URL (e.g. older zone saved before URL was in catalog).
  // Reconstruct from _catalogType + screen org_id captured at sync time.
  if (type === 'widget' && !url) {
    const CATALOG_URLS = {
      'queue-display': 'https://narhbpojjtnalyfiwxue.supabase.co/storage/v1/object/public/system-widgets/queue_display/index.html',
    };
    const catalogType = item.widgetConfig?._catalogType ?? item.widgetConfig?.widgetType ?? '';
    const baseUrl = CATALOG_URLS[catalogType];
    if (baseUrl) {
      try {
        const u   = new URL(baseUrl);
        const cfg = item.widgetConfig ?? {};
        // org-scoped params come from the screen's org, not the saved config
        if (currentOrgId)              u.searchParams.set('orgId',        currentOrgId);
        // config-level overrides saved inside widgetConfig
        if (cfg.ttsLang      != null)  u.searchParams.set('ttsLang',      String(cfg.ttsLang));
        if (cfg.cycleSeconds != null)  u.searchParams.set('cycleSeconds', String(cfg.cycleSeconds));
        if (cfg.bgColor      != null)  u.searchParams.set('bgColor',      String(cfg.bgColor));
        if (cfg.textColor    != null)  u.searchParams.set('textColor',    String(cfg.textColor));
        if (cfg.accentColor  != null)  u.searchParams.set('accentColor',  String(cfg.accentColor));
        url = u.toString();
      } catch { /* leave url empty */ }
    }
  }

  return {
    id:      item.id     ?? null,
    type,
    url,
    sha256:  item.sha256 ?? null,
    // designer uses "duration"; legacy uses "dwell" / "dwell_seconds"
    dwell:   item.dwell ?? item.dwell_seconds ?? item.dwellSeconds ?? item.duration ?? 10,
    name:    item.name  ?? item.media_name ?? '',
    // Priority: per-item fitMode → zone-level fitMode → designer default 'cover-x'
    fitMode: item.fitMode ?? zoneFitMode ?? 'cover-x',
  };
}

function coerce(v) { return typeof v === 'string' ? parseFloat(v) || 0 : (v ?? 0); }

// If value > 1 assume it's already a percentage 0-100; else multiply by 100
function normaliseCoord(v) { return v > 1 ? v : v * 100; }
function normaliseSize(v)  { return v > 1 ? v : v * 100; }

function pct(v) { return v + '%'; }

// ── ZonePlayer ─────────────────────────────────────────────────────────────────
class ZonePlayer {
  constructor(el, items) {
    this._el      = el;
    this._items   = items;
    this._index   = 0;
    this._timer   = null;
    this._media   = null;
  }

  start() {
    if (!this._items.length) { this._el.style.background = '#111'; return; }
    this._playIndex(0);
  }

  async _playIndex(i) {
    if (!this._items.length) return;
    this._index = i % this._items.length;
    const item  = this._items[this._index];
    clearTimeout(this._timer);
    this._el.innerHTML = '';
    this._media = null;

    const src = await this._resolveUrl(item);

    // fitMode → CSS object-fit (for VIDEO only; images use per-mode absolute CSS below)
    // Designer stores: 'cover-x' (橫向填滿) | 'cover-y' (直向填滿) |
    //                  'contain' (完整顯示)  | 'stretch' (變形填滿)
    const fitCss = item.fitMode === 'stretch'  ? 'fill'
                 : item.fitMode === 'contain'   ? 'contain'
                 :                               'cover'; // cover-x / cover-y / default → cover

    if (item.type === 'widget') {
      // Widgets are rendered as sandboxed iframes
      const iframe = document.createElement('iframe');
      iframe.src           = src;
      iframe.style.width   = '100%';
      iframe.style.height  = '100%';
      iframe.style.border  = 'none';
      iframe.style.display = 'block';
      iframe.allow         = 'autoplay';
      iframe.scrolling     = 'no';
      this._el.appendChild(iframe);
      this._media = iframe;
      // Only rotate widgets out if there are other items in the playlist
      if (this._items.length > 1) {
        this._timer = setTimeout(() => {
          this._logPlay(item);
          this._next();
        }, (item.dwell || 30) * 1000);
      }
    } else if (item.type === 'video') {
      const vid = document.createElement('video');
      vid.src         = src;
      vid.autoplay    = true;
      vid.muted       = true;
      vid.loop        = this._items.length === 1;
      vid.playsInline = true;
      vid.style.objectFit = fitCss;
      vid.addEventListener('ended', () => {
        this._logPlay(item);
        this._next();
      });
      vid.addEventListener('error', () => this._next());
      this._el.appendChild(vid);
      this._media = vid;
    } else {
      const img = document.createElement('img');
      img.src = src;
      img.alt = item.name || '';
      img.addEventListener('error', () => this._next());

      // Apply the correct CSS for each designer fitMode value.
      // .zone has position:absolute + overflow:hidden so children can use
      // absolute positioning relative to the zone container.
      switch (item.fitMode) {
        case 'cover-x':
          // 橫向填滿 — fill width, height proportional, centre vertically
          img.style.cssText = 'position:absolute;left:0;top:50%;width:100%;height:auto;transform:translateY(-50%);display:block;';
          break;
        case 'cover-y':
          // 直向填滿 — fill height, width proportional, centre horizontally
          img.style.cssText = 'position:absolute;top:0;left:50%;height:100%;width:auto;transform:translateX(-50%);display:block;';
          break;
        case 'contain':
          // 完整顯示
          img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;';
          break;
        case 'stretch':
          // 變形填滿
          img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;';
          break;
        default:
          // cover / safe default — fills zone completely from centre
          img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;';
      }

      this._el.appendChild(img);
      this._media = img;
      this._timer = setTimeout(() => {
        this._logPlay(item);
        this._next();
      }, (item.dwell || 10) * 1000);
    }
  }

  _next() {
    this._playIndex((this._index + 1) % this._items.length);
  }

  async refreshCurrentSource() {
    if (!this._media || !this._items.length) return;
    const item = this._items[this._index];
    const src  = await this._resolveUrl(item);
    if (src !== this._media.src) this._media.src = src;
  }

  async _resolveUrl(item) {
    if (item.type === 'widget') {
      // Try local widget HTML cache first (widget://<hash>?…params…)
      const baseUrl = item.url.split('?')[0];
      if (baseUrl) {
        const localBase = await window.player.getWidgetUrl?.(baseUrl);
        if (localBase) {
          // Preserve query params (orgId, ttsLang, …)
          const qs = item.url.includes('?') ? '?' + item.url.split('?')[1] : '';
          return localBase + qs;
        }
      }
      return item.url; // network fallback
    }
    if (item.sha256) {
      const local = await window.player.getCachedUrl(item.url);
      if (local) return local;
    }
    return item.url;
  }

  _logPlay(item) {
    if (!item.id) return;
    window.player.addLog(JSON.stringify({
      media_id:         item.id,
      duration_seconds: item.type === 'video' ? Math.round(this._media?.duration ?? 0) : item.dwell,
    }));
  }

  destroy() {
    clearTimeout(this._timer);
    if (this._media) {
      if (this._media.tagName === 'VIDEO') this._media.pause();
      this._media.src = '';
    }
    this._el.innerHTML = '';
  }
}

function zonePlayersAdd(id, p) { zonePlayersDestroy(id); zonePlayers.set(id, p); }
function zonePlayersDestroy(id) { zonePlayers.get(id)?.destroy(); zonePlayers.delete(id); }
function zonePlayersClear() { for (const id of zonePlayers.keys()) zonePlayersDestroy(id); }


// ── HUD ───────────────────────────────────────────────────────────────────────
async function refreshHud() {
  // Sync aspect ratio state from main process (in case another HUD session changed it)
  const ar = await window.player.getAspectRatio?.();
  if (ar) { currentAspectRatio = ar; }
  updateAspectRatioHud();
  updateHudLayouts();
  updatePageTransHud();

  const stats = await window.player.getCacheStats();
  if (!stats) return;

  set('h-server',  stats.serverUrl ?? '—');
  set('h-token',   stats.deviceToken ?? '—');
  set('h-screen',  stats.screenName ?? '—');
  set('h-channel', stats.channelName ?? '—');
  set('h-project', stats.projectName ?? '—');
  set('h-last-sync', stats.lastSyncAt ? new Date(stats.lastSyncAt).toLocaleTimeString() : lastSyncTime ?? '—');
  set('h-cas-files', `${stats.casFileCount} files`);
  set('h-cas-size',  fmtBytes(stats.casTotalBytes));
  set('h-cas-dir',   stats.casDirPath ?? '—');
  set('h-cas-fail',  stats.manifestFailed > 0
    ? `<span class="pill error">${stats.manifestFailed} failed</span>` : `<span class="pill ok">none</span>`);

  const pct = stats.syncPct;
  set('h-cas-pct', pct !== null
    ? `<span class="pill ${pct === 100 ? 'ok' : 'warn'}">${pct}%</span>` : '—');

  updateHudStatus();
}

function updateHudStatus() {
  set('h-sync', lastSyncTime
    ? `<span class="pill ok">last ${lastSyncTime}</span>`
    : '<span class="pill grey">waiting</span>');
  set('h-rt', realtimeConnected
    ? '<span class="pill ok">connected</span>'
    : '<span class="pill warn">disconnected</span>');
  document.getElementById('hud-ver').textContent = 'v1.0.0';
}

function set(id, html) {
  const el = document.getElementById(id);
  if (el) el.innerHTML = html;
}

function fmtBytes(b) {
  if (!b) return '0 B';
  const units = ['B','KB','MB','GB'];
  let i = 0;
  while (b >= 1024 && i < units.length - 1) { b /= 1024; i++; }
  return b.toFixed(1) + ' ' + units[i];
}

// ── Layout / page switcher ─────────────────────────────────────────────────
// Priority: page-level layouts (within one project) > channel-level layouts
function updateHudLayouts() {
  const section = document.getElementById('hud-layout-section');
  const btnsEl  = document.getElementById('hud-layout-btns');
  if (!section || !btnsEl) return;

  // Page layouts (from _meta.pages) take priority when present
  const usingPages = pageLayouts.length >= 2;
  const layouts    = usingPages ? pageLayouts : availableLayouts;
  const curId      = usingPages ? activePageId : (activeLayoutId ?? currentProject?.id);

  if (layouts.length < 2) {
    section.style.display = 'none';
    return;
  }
  section.style.display = '';

  btnsEl.innerHTML = layouts.map((layout, i) => {
    const active  = layout.id === curId;
    const label   = escHtml((i + 1) + '. ' + layout.name.slice(0, 14));
    const handler = usingPages
      ? `doSwitchPage('${layout.id}')`
      : `doSwitchLayout('${layout.id}')`;
    return `<button onclick="${handler}" class="${active ? 'active' : ''}">${label}</button>`;
  }).join('');
}

// ── 版型切換條件 HUD section ──────────────────────────────────────────────────
function updatePageTransHud() {
  const section = document.getElementById('hud-pagetrans-section');
  if (!section) return;

  const pt = _getCurrentPageTransition();
  if (!pt || pageLayouts.length < 2) {
    section.style.display = 'none';
    return;
  }
  section.style.display = '';

  // ── Mode ────────────────────────────────────────────────────────────────────
  const isAuto = pt.mode === 'auto';
  set('h-pt-mode', isAuto
    ? `<span class="pill info">自動 ${pt.seconds}s</span>`
    : `<span class="pill grey">手動</span>`);

  // ── Countdown (auto mode only) ───────────────────────────────────────────────
  const countdownRow = document.getElementById('h-pt-countdown-row');
  if (countdownRow) countdownRow.style.display = isAuto ? '' : 'none';
  if (isAuto) {
    const rem  = pageAutoRemaining;
    const mins = Math.floor(rem / 60).toString().padStart(2, '0');
    const secs = (rem % 60).toString().padStart(2, '0');
    const pauseTag = pageAutoPaused ? ' <span class="pill warn">暫停</span>' : '';
    set('h-pt-countdown', `${mins}:${secs}${pauseTag}`);
  }

  // ── Active triggers ──────────────────────────────────────────────────────────
  const trigs = pt.triggers ?? {};
  const trigParts = [];
  if (trigs.api)    trigParts.push('<span class="pill info">API</span>');
  if (trigs.gpio)   trigParts.push('<span class="pill info">GPIO</span>');
  if (trigs.remote) trigParts.push('<span class="pill info">遙控</span>');
  set('h-pt-triggers', trigParts.length
    ? trigParts.join(' ')
    : '<span class="pill grey">無</span>');

  // ── Remote codes per page ────────────────────────────────────────────────────
  const codesSection = document.getElementById('h-pt-codes-section');
  if (codesSection) {
    const channels = pt.pageChannels ?? [];
    if (trigs.remote && channels.length > 0) {
      codesSection.style.display = '';
      set('h-pt-codes', channels.map(c => {
        const active = c.id === activePageId;
        const badge  = active ? ' class="pill ok"' : ' class="pill grey"';
        return `<span${badge}>${escHtml(c.name)} <b>${escHtml(c.remoteCode ?? '?')}</b></span>`;
      }).join(' '));
    } else {
      codesSection.style.display = 'none';
    }
  }

  // ── Control buttons ──────────────────────────────────────────────────────────
  const btnsEl = document.getElementById('h-pt-btns');
  if (btnsEl) {
    if (isAuto) {
      const label = pageAutoPaused ? '▶ 繼續自動切換' : '⏸ 暫停自動切換';
      const cls   = pageAutoPaused ? '' : 'active';
      btnsEl.innerHTML = `<button onclick="doToggleAutoSwitch()" class="${cls}">${label}</button>`;
    } else {
      btnsEl.innerHTML = '';
    }
  }
}

// Switch between pages within the current project (page-level layouts)
function doSwitchPage(pageId) {
  const page = pageLayouts.find(p => p.id === pageId);
  if (!page) { log('找不到版型: ' + pageId, 'err'); return; }
  if (!currentProject) return;
  // Re-render with the new page selected (renderProject calls stopPageAutoSwitch then restarts)
  renderProject(currentProject, pageId);
  log(`版型切換 → ${page.name}`, 'ok');
}

// ── Page auto-switch engine ────────────────────────────────────────────────────

// Stop the running countdown interval (safe to call when already stopped).
function stopPageAutoSwitch() {
  clearInterval(pageAutoInterval);
  pageAutoInterval  = null;
  pageAutoRemaining = 0;
}

// Start (or restart) the 1-second countdown ticker.
// Preserves pageAutoPaused so the caller decides whether to honour it.
function startPageAutoSwitch(seconds) {
  stopPageAutoSwitch();
  if (!seconds || pageLayouts.length < 2) return;
  pageAutoSeconds   = seconds;
  pageAutoRemaining = seconds;

  pageAutoInterval = setInterval(() => {
    if (pageAutoPaused) return;          // ticks keep running; countdown frozen
    pageAutoRemaining = Math.max(0, pageAutoRemaining - 1);
    if (hudVisible) updatePageTransHud();
    if (pageAutoRemaining <= 0) {
      if (!currentProject || pageLayouts.length < 2) return;
      const curIdx  = pageLayouts.findIndex(p => p.id === activePageId);
      const nextIdx = (curIdx + 1) % pageLayouts.length;
      const nextId  = pageLayouts[nextIdx].id;
      activePageId      = nextId;
      pageAutoRemaining = pageAutoSeconds;  // reset for next cycle
      // renderProject calls stopPageAutoSwitch → startPageAutoSwitch, which
      // re-creates the interval — exit this tick cleanly first.
      setTimeout(() => renderProject(currentProject, nextId), 0);
    }
  }, 1000);
}

// Pause / resume auto-switch (toggled by HUD button)
function doToggleAutoSwitch() {
  pageAutoPaused = !pageAutoPaused;
  // If resuming and the interval was somehow cleared, restart it
  if (!pageAutoPaused && !pageAutoInterval && pageAutoSeconds > 0 && pageLayouts.length >= 2) {
    startPageAutoSwitch(pageAutoSeconds);
  }
  if (hudVisible) updatePageTransHud();
  log(pageAutoPaused ? '自動切換已暫停' : '自動切換已恢復', 'ok');
}

// Return the pageTransition object from the current project's _meta, or null.
function _getCurrentPageTransition() {
  if (!currentProject) return null;
  const zonesArr = Array.isArray(currentProject.zones) ? currentProject.zones : [];
  const metaObj  = zonesArr.find(z => z?._meta);
  return metaObj?.pageTransition ?? null;
}

// Switch between different design projects at the channel level
function doSwitchLayout(layoutId) {
  const layout = availableLayouts.find(l => l.id === layoutId);
  if (!layout) { log('Layout not found', 'err'); return; }
  if (!layout.zones) { log('版型資料尚未載入，請等待下次 Sync', 'err'); return; }
  activeLayoutId = layoutId;
  activePageId   = null;     // reset page selection when switching to different project
  stopPageAutoSwitch();
  pageAutoPaused = false;
  currentProject = layout;
  renderProject(layout);
  updateHudLayouts();
  log(`版型切換 → ${layout.name}`, 'ok');
}

// ── Aspect ratio ──────────────────────────────────────────────────────────────
// Internal: apply ratio without marking as manually set (used for auto-detect).
function _applyAspectRatio(ratio, manual = true) {
  currentAspectRatio = ratio;
  if (manual) aspectManuallySet = true;
  window.player.setAspectRatio(ratio);
  updateAspectRatioHud();
}

// Called by HUD buttons — always marks as manual so auto-detect won't override.
function doSetAspectRatio(ratio) {
  _applyAspectRatio(ratio, true);
  log(`Aspect ratio → ${ratio}`);
}

function updateAspectRatioHud() {
  const labels = {
    '16:9': '16:9 橫向',
    '9:16': '9:16 直向',
    'free': 'Free',
  };
  const cls = currentAspectRatio === 'free' ? 'grey' : 'info';
  set('h-aspect', `<span class="pill ${cls}">${labels[currentAspectRatio] ?? currentAspectRatio}</span>`);

  // Highlight active button
  for (const [id, val] of [['ar-btn-16-9','16:9'],['ar-btn-9-16','9:16'],['ar-btn-free','free']]) {
    document.getElementById(id)?.classList.toggle('active', currentAspectRatio === val);
  }
}

// ── Actions ───────────────────────────────────────────────────────────────────
function doForceSync() {
  log('Force sync triggered…');
  window.player.forceSync();
}

async function doVerify() {
  log('Integrity check started…');
  const res = await window.player.verifyIntegrity();
  log(`Integrity check done: ${res.checked} checked, ${res.failed} failed`, res.failed > 0 ? 'err' : 'ok');
}

function doRestart() {
  log('Restarting player…', 'err');
  setTimeout(() => window.player.restartPlayer(), 300);
}

function doUpdate() {
  log('Starting update (git pull + build)…', 'ok');
  window.player.updateSoftware();
}

window.addEventListener('__signUpdateLog', (e) => {
  const { line, done, ok } = e.detail;
  if (line) log(line, ok === false ? 'err' : '');
  if (done) {
    if (ok)  log('✓ Installing to /Applications — relaunching in 1 s…', 'ok');
    if (!ok) log('✗ Update failed — see log above for details', 'err');
  }
});

// ── Event log (HUD) ───────────────────────────────────────────────────────────
const logLines = [];
function log(msg, cls = '') {
  const time = new Date().toLocaleTimeString();
  logLines.unshift({ msg, cls, time });
  if (logLines.length > 100) logLines.pop();
  if (hudVisible) renderLog();
}
function renderLog() {
  const c = document.getElementById('log-container');
  c.innerHTML = logLines.slice(0, 40).map(l =>
    `<div class="${l.cls}">${l.time} ${escHtml(l.msg)}</div>`
  ).join('');
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
