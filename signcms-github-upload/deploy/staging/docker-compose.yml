version: '3.9'
# Staging — Port 3001 / 4001

services:
  redis:
    image: redis:7-alpine
    container_name: signcms-staging-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    volumes:
      - /opt/signcms/staging/data/redis:/data
    healthcheck:
      test: ["CMD","redis-cli","-a","${REDIS_PASSWORD}","ping"]
      interval: 10s; timeout: 5s; retries: 5
    networks: [staging]

  bff:
    image: ghcr.io/bizlution/signcms-bff:${IMAGE_TAG:-edge}
    container_name: signcms-staging-bff
    restart: unless-stopped
    env_file: /opt/signcms/staging/config/.env
    ports: ["127.0.0.1:3001:3001"]
    volumes: ["/opt/signcms/staging/data/media:/app/media"]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD","wget","-qO-","http://localhost:3001/health"]
      interval: 30s; timeout: 10s; retries: 3; start_period: 30s
    networks: [staging]
    labels: [env=staging]
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}

  knowledge-manager:
    image: ghcr.io/bizlution/signcms-knowledge-manager:${IMAGE_TAG:-edge}
    container_name: signcms-staging-knowledge
    restart: unless-stopped
    environment:
      PORT: 4001
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5-20251001}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    ports: ["127.0.0.1:4001:4001"]
    volumes: ["/opt/signcms/staging/docs:/docs:ro"]
    networks: [staging]
    depends_on: [bff]

networks:
  staging:
    name: signcms-staging
