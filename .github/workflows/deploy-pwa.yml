name: Deploy SignCMS Go PWA → GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "signcms-go/**"
      - ".github/workflows/deploy-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages:    write
  id-token: write

concurrency:
  group: "gh-pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: signcms-go/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: signcms-go

      - name: Build
        run: npm run build
        working-directory: signcms-go
        env:
          GITHUB_PAGES: "1"
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      # Copy index.html → 404.html so BrowserRouter works on page-refresh
      - name: Add SPA fallback
        run: cp signcms-go/dist/index.html signcms-go/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: signcms-go/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
