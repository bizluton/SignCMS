name: CI / CD

on:
  push:
    branches: [master]
    tags:     ['v*.*.*']
  workflow_dispatch:
    inputs:
      target:
        description: '部署目標'
        required: true
        type: choice
        options: [staging, production]
        default: staging

jobs:

  deploy-staging:
    name: "Deploy → Staging"
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'staging')
    environment: staging
    steps:
      - name: 更新 Staging .env
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          port:     ${{ secrets.SERVER_PORT || 22 }}
          script: |
            ENV_FILE="/opt/signcms/staging/config/.env"
            update_env() {
              local KEY="$1" VAL="$2"
              if grep -q "^${KEY}=" "$ENV_FILE" 2>/dev/null; then
                sed -i "s|^${KEY}=.*|${KEY}=${VAL}|" "$ENV_FILE"
              else
                echo "${KEY}=${VAL}" >> "$ENV_FILE"
              fi
            }
            update_env SUPABASE_URL              "${{ secrets.STAGING_SUPABASE_URL }}"
            update_env SUPABASE_ANON_KEY         "${{ secrets.STAGING_SUPABASE_ANON_KEY }}"
            update_env SUPABASE_SERVICE_ROLE_KEY "${{ secrets.STAGING_SUPABASE_SERVICE_KEY }}"
            update_env SUPABASE_JWT_SECRET       "${{ secrets.STAGING_SUPABASE_JWT_SECRET }}"
            update_env ANTHROPIC_API_KEY         "${{ secrets.ANTHROPIC_API_KEY }}"
            update_env BFF_PUBLIC_URL            "https://staging.signcms.net"
            update_env FRONTEND_ORIGIN           "https://staging.signcms.net"
            echo "env updated"

      - name: 部署 Staging
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          port:     ${{ secrets.SERVER_PORT || 22 }}
          script: |
            bash /opt/signcms/staging/scripts/deploy.sh "edge"

  deploy-production:
    name: "Deploy → Production"
    runs-on: ubuntu-latest
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production')
    environment: production
    steps:
      - name: 更新 Production .env
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          port:     ${{ secrets.SERVER_PORT || 22 }}
          script: |
            ENV_FILE="/opt/signcms/production/config/.env"
            update_env() {
              local KEY="$1" VAL="$2"
              if grep -q "^${KEY}=" "$ENV_FILE" 2>/dev/null; then
                sed -i "s|^${KEY}=.*|${KEY}=${VAL}|" "$ENV_FILE"
              else
                echo "${KEY}=${VAL}" >> "$ENV_FILE"
              fi
            }
            update_env SUPABASE_URL              "${{ secrets.PRODUCTION_SUPABASE_URL }}"
            update_env SUPABASE_ANON_KEY         "${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}"
            update_env SUPABASE_SERVICE_ROLE_KEY "${{ secrets.PRODUCTION_SUPABASE_SERVICE_KEY }}"
            update_env SUPABASE_JWT_SECRET       "${{ secrets.PRODUCTION_SUPABASE_JWT_SECRET }}"
            update_env ANTHROPIC_API_KEY         "${{ secrets.ANTHROPIC_API_KEY }}"
            update_env BFF_PUBLIC_URL            "https://cms.signcms.net"
            update_env FRONTEND_ORIGIN           "https://cms.signcms.net"
            echo "env updated"

      - name: 部署 Production
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          port:     ${{ secrets.SERVER_PORT || 22 }}
          script: |
            bash /opt/signcms/production/scripts/deploy.sh "latest"
