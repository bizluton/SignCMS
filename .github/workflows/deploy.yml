name: CI / CD

on:
  push:
    branches: [master]
    tags:     ['v*.*.*']
  workflow_dispatch:
    inputs:
      target:
        description: '部署目標'
        required: true
        type: choice
        options: [staging, production]
        default: staging

jobs:

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: screenleap-central-main

      - name: Build
        run: npm run build
        working-directory: screenleap-central-main
        env:
          VITE_SUPABASE_URL: https://narhbpojjtnalyfiwxue.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_oaGzMwC2nmSLDoxJySa1ig_r8scS7Hu
          VITE_BFF_URL: https://staging.signcms.net

      - name: Upload dist
        uses: actions/upload-artifact@v4.6.2
        with:
          name: frontend-dist
          path: screenleap-central-main/dist/
          retention-days: 1

  deploy-staging:
    name: "Deploy → Staging"
    runs-on: ubuntu-latest
    needs: build-frontend
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'staging')
    environment: staging
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4.3.0
        with:
          name: frontend-dist
          path: ./dist

      - name: 更新 Staging .env
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            ENV_FILE="/opt/signcms/staging/config/.env"
            update_env() {
              local KEY="$1" VAL="$2"
              if grep -q "^${KEY}=" "$ENV_FILE" 2>/dev/null; then
                sed -i "s|^${KEY}=.*|${KEY}=${VAL}|" "$ENV_FILE"
              else
                echo "${KEY}=${VAL}" >> "$ENV_FILE"
              fi
            }
            update_env SUPABASE_URL              "${{ secrets.STAGING_SUPABASE_URL }}"
            update_env SUPABASE_ANON_KEY         "${{ secrets.STAGING_SUPABASE_ANON_KEY }}"
            update_env SUPABASE_SERVICE_ROLE_KEY "${{ secrets.STAGING_SUPABASE_SERVICE_KEY }}"
            update_env SUPABASE_JWT_SECRET       "${{ secrets.STAGING_SUPABASE_JWT_SECRET }}"
            update_env ANTHROPIC_API_KEY         "${{ secrets.ANTHROPIC_API_KEY }}"
            update_env BFF_PUBLIC_URL            "https://staging.signcms.net"
            update_env FRONTEND_ORIGIN           "https://staging.signcms.net"
            mkdir -p /var/www/signcms-staging
            echo "env updated"

      - name: 部署前端
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "dist/*"
          target: "/var/www/signcms-staging"
          strip_components: 1

      - name: 部署 BFF 與設定 Nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            bash /opt/signcms/staging/scripts/deploy.sh "edge"
            CERT=/etc/letsencrypt/live/staging.signcms.net
            CONF=/etc/nginx/sites-available/signcms-staging
            if [ -f "$CERT/fullchain.pem" ]; then
              printf 'server {\n    listen 80;\n    server_name staging.signcms.net;\n    return 301 https://$host$request_uri;\n}\nserver {\n    listen 443 ssl;\n    server_name staging.signcms.net;\n    ssl_certificate     '"$CERT"'/fullchain.pem;\n    ssl_certificate_key '"$CERT"'/privkey.pem;\n    root /var/www/signcms-staging;\n    index index.html;\n    error_page 404 /404.html;\n    location / {\n        try_files $uri $uri/ /index.html;\n    }\n    location /api/ {\n        proxy_pass http://127.0.0.1:3001;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_buffering off;\n    }\n    location /health {\n        proxy_pass http://127.0.0.1:3001/health;\n    }\n}\n' | sudo tee "$CONF" > /dev/null
            else
              printf 'server {\n    listen 80;\n    server_name staging.signcms.net;\n    root /var/www/signcms-staging;\n    index index.html;\n    error_page 404 /404.html;\n    location / {\n        try_files $uri $uri/ /index.html;\n    }\n    location /api/ {\n        proxy_pass http://127.0.0.1:3001;\n        proxy_set_header Host $host;\n        proxy_buffering off;\n    }\n    location /health {\n        proxy_pass http://127.0.0.1:3001/health;\n    }\n}\n' | sudo tee "$CONF" > /dev/null
            fi
            sudo ln -sf "$CONF" /etc/nginx/sites-enabled/signcms-staging
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t && sudo systemctl reload nginx && echo "✅ nginx reloaded" || echo "❌ nginx -t failed"
            echo "✅ 完成"

  deploy-production:
    name: "Deploy → Production"
    runs-on: ubuntu-latest
    needs: build-frontend
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production')
    environment: production
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4.3.0
        with:
          name: frontend-dist
          path: ./dist

      - name: 更新 Production .env
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            ENV_FILE="/opt/signcms/production/config/.env"
            update_env() {
              local KEY="$1" VAL="$2"
              if grep -q "^${KEY}=" "$ENV_FILE" 2>/dev/null; then
                sed -i "s|^${KEY}=.*|${KEY}=${VAL}|" "$ENV_FILE"
              else
                echo "${KEY}=${VAL}" >> "$ENV_FILE"
              fi
            }
            update_env SUPABASE_URL              "${{ secrets.STAGING_SUPABASE_URL }}"
            update_env SUPABASE_ANON_KEY         "${{ secrets.STAGING_SUPABASE_ANON_KEY }}"
            update_env SUPABASE_SERVICE_ROLE_KEY "${{ secrets.STAGING_SUPABASE_SERVICE_KEY }}"
            update_env SUPABASE_JWT_SECRET       "${{ secrets.STAGING_SUPABASE_JWT_SECRET }}"
            update_env ANTHROPIC_API_KEY         "${{ secrets.ANTHROPIC_API_KEY }}"
            update_env BFF_PUBLIC_URL            "https://staging.signcms.net"
            update_env FRONTEND_ORIGIN           "https://staging.signcms.net"
            mkdir -p /var/www/signcms-production
            echo "env updated"

      - name: 部署前端
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "dist/*"
          target: "/var/www/signcms-production"
          strip_components: 1

      - name: 部署 BFF
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            bash /opt/signcms/production/scripts/deploy.sh "latest"
            echo "✅ 完成"
